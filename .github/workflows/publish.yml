name: Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate dispatch ref
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" = "refs/heads/main" ]; then
            exit 0
          fi
          if [[ "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 0
          fi

          echo "Unsupported publish ref: $RELEASE_REF" >&2
          exit 1

  prepare-release:
    needs: validate-dispatch
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: release
        name: Resolve patch release
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(jq -er '.name' package.json)"
          package_version="$(jq -er '.version' package.json)"
          published_version="$(npm view "${package_name}@latest" version)"
          release_version="$(bun scripts/release-version.ts next "$published_version")"
          release_tag="v${release_version}"
          tagged_version="-"

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            if [ "$(git cat-file -t "refs/tags/$release_tag")" != "tag" ]; then
              echo "Release ref must be an annotated tag: $release_tag" >&2
              exit 1
            fi
            tagged_version="$(git show "${release_tag}:package.json" | jq -er '.version')"
          fi

          bun scripts/release-version.ts resolve \
            "$package_version" \
            "$published_version" \
            "$tagged_version" >> "$GITHUB_OUTPUT"
      - name: Validate and create release
        if: steps.release.outputs.mode == 'prepare'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          bun ci
          bun run security
          bun run check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: $RELEASE_TAG"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
      - name: Verify tagged commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release ref must be an annotated tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$release_sha" origin/main
      - name: Start trusted publish run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg ref "$RELEASE_TAG" \
            '{ref: $ref}')"
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" \
            --data "$payload"

  verify-release:
    needs: validate-dispatch
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish-required: ${{ steps.registry.outputs.publish-required }}
    steps:
      - id: release-ref
        name: Validate release ref
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Invalid Git tag ref: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit SHA" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release-ref.outputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Verify immutable release source
        env:
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release ref must be an annotated tag: $RELEASE_TAG" >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          package_version="$(jq -er '.version' package.json)"

          if [ "$actual_sha" != "$RELEASE_SHA" ] || [ "$tagged_sha" != "$RELEASE_SHA" ]; then
            echo "Release tag and event SHA do not match" >&2
            exit 1
          fi
          if [ "v$package_version" != "$RELEASE_TAG" ]; then
            echo "Package version and release tag do not match" >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Install locked dependencies
        run: bun ci
      - name: Audit dependencies
        run: bun run security
      - name: Verify package
        run: bun run check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: registry
        name: Revalidate npm registry state
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(jq -er '.name' package.json)"
          package_version="$(jq -er '.version' package.json)"
          metadata="$(npm view "$package_name" version versions --json)"
          registry_version="$(jq -er '.version | select(type == "string")' <<< "$metadata")"
          candidate_exists="$(jq -er \
            --arg version "$package_version" \
            '(.versions | if type == "array" then . else [.] end) | index($version) != null' \
            <<< "$metadata")"

          bun scripts/release-version.ts publication \
            "$package_version" \
            "$registry_version" \
            "$candidate_exists" >> "$GITHUB_OUTPUT"
      - id: pack
        name: Pack verified package
        if: steps.registry.outputs.publish-required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pack_metadata="$(npm pack --ignore-scripts --json)"
          archive="$(jq -er '.[0].filename' <<< "$pack_metadata")"
          case "$archive" in
            *.tgz) ;;
            *)
              echo "Unexpected npm pack output: $archive" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$archive" ]; then
            echo "npm pack did not create $archive" >&2
            exit 1
          fi

          sha256sum "$archive" > package.sha256
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Upload verified package
        if: steps.registry.outputs.publish-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.archive }}
            package.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: verify-release
    if: needs.verify-release.outputs.publish-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Publish verified package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(awk 'NR == 1 { print $2 }' package.sha256)"
          case "$archive" in
            ""|*/*)
              echo "Invalid package archive name: $archive" >&2
              exit 1
              ;;
            *.tgz) ;;
            *)
              echo "Unexpected package archive: $archive" >&2
              exit 1
              ;;
          esac

          sha256sum --check package.sha256
          npm publish "$archive" --ignore-scripts --provenance
