name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve-release-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$PUSH_TAG"
          fi

          if [ -z "$release_tag" ]; then
            echo "A release tag is required" >&2
            exit 1
          fi

          if ! git check-ref-format --allow-onelevel "refs/tags/$release_tag"; then
            echo "Invalid release tag" >&2
            exit 1
          fi

          case "$release_tag" in
            v*) ;;
            *)
              echo "Release tag must begin with v" >&2
              exit 1
              ;;
          esac

          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-release-tag
    runs-on: ubuntu-latest
    name: Publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.resolve-release-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun ci
      - name: Audit dependencies
        run: bun run security
      - run: bun run check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance
